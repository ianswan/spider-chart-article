<!doctype html>
<html>
	<head>
		<title>Basketball Player Comparison</title>

		<link rel="icon" href="data:;base64,iVBORwOKGO=" />
		<link rel="stylesheet" href="css/style.css" />

		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body>
		<h1>Basketball Player Comparison</h1>

		<!-- --------------------------------
             Filters
        --------------------------------- -->

		<div class="filters">
			<div class="filter-group">
				<label for="team-filter">Select Team:</label>

				<select id="team-filter">
					<option value="">All Teams</option>
				</select>
			</div>

			<div class="filter-group">
				<label for="player-filter"> Select Players (up to 5): </label>

				<select id="player-filter" multiple size="5"></select>
			</div>
		</div>

		<!-- --------------------------------
             Charts
        --------------------------------- -->

		<div class="charts-container">
			<div id="spider-charts"></div>

			<div id="line-chart"></div>

			<div id="bar-chart"></div>

			<div id="parallel-coordinates"></div>

			<div id="stat-deviation-chart"></div>
			<div id="stat-deviation-chart-centered"></div>
		</div>

		<!-- --------------------------------
             Player Legend
        --------------------------------- -->

		<div id="player-legend" class="player-legend"></div>

		<!-- --------------------------------
             JavaScript
        --------------------------------- -->

		<script src="js/d3.v6.min.js"></script>

		<script src="js/spiderchart.js"></script>
		<script src="js/linechart.js"></script>
		<script src="js/barchart.js"></script>
		<script src="js/parallelcoordinates.js"></script>
		<script src="js/statdeviationchart.js"></script>
		<script src="js/statdeviationchart-centered.js"></script>

		<script src="js/main.js"></script>
	</body>
</html>
